# Compila la APK en los servidores de GitHub (gratis en repositorios públicos)
# y la publica en "Releases". Las apps instaladas la detectan y ofrecen instalarla.
#
# Se ejecuta solo con cada cambio en la rama main (salvo cambios de documentación),
# o a mano desde la pestaña "Actions" -> "Compilar APK" -> "Run workflow".
#
# Necesita dos secretos del repositorio (Settings -> Secrets and variables -> Actions):
#   PRE_KEYSTORE_B64       la clave de firma en base64
#   PRE_KEYSTORE_PASSWORD  su contraseña
# Están anotados en el archivo de RESPALDO que quedó en la PC y en Drive (nunca en este repositorio).

name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar-apk
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Bajar el código
        uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Revisar que estén los secretos
        env:
          B64: ${{ secrets.PRE_KEYSTORE_B64 }}
          CLAVE: ${{ secrets.PRE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$B64" ] || [ -z "$CLAVE" ]; then
            echo "::error::Faltan los secretos PRE_KEYSTORE_B64 y/o PRE_KEYSTORE_PASSWORD (ver archivo de RESPALDO)."
            exit 1
          fi

      - name: Colocar la clave de firma
        env:
          B64: ${{ secrets.PRE_KEYSTORE_B64 }}
        run: echo "$B64" | base64 -d > "$RUNNER_TEMP/pre.jks"

      - name: Compilar APK firmada
        env:
          PRE_KEYSTORE_PATH: ${{ runner.temp }}/pre.jks
          PRE_KEYSTORE_PASSWORD: ${{ secrets.PRE_KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Preparar publicación
        id: datos
        run: |
          VC=$((GITHUB_RUN_NUMBER + 1))
          VN="1.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk PRE-Juveniles-CDL.apk
          NOTAS=$(git log -1 --pretty=%s | jq -Rs .)
          printf '{"versionCode":%s,"versionName":"%s","apk":"https://github.com/%s/releases/download/v%s/PRE-Juveniles-CDL.apk","notas":%s}\n' \
            "$VC" "$VN" "$GITHUB_REPOSITORY" "$VN" "$NOTAS" > version.json
          cat version.json
          echo "vn=$VN" >> "$GITHUB_OUTPUT"

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.datos.outputs.vn }}
          name: PRE Juveniles CDL ${{ steps.datos.outputs.vn }}
          body: |
            Descargá **PRE-Juveniles-CDL.apk** e instalala. Las apps ya instaladas la ofrecen solas al abrirse.
          files: |
            PRE-Juveniles-CDL.apk
            version.json
          make_latest: true

      - name: Borrar la clave del servidor
        if: always()
        run: rm -f "$RUNNER_TEMP/pre.jks"
